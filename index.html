<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2225960538073232"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ff4081;
            text-shadow: 3px 3px 0 #ffeb3b;
            animation: bounce 2s infinite;
        }
        
        .birthday-cake {
            width: 200px;
            height: 150px;
            margin: 30px auto;
            position: relative;
        }
        
        .cake {
            width: 180px;
            height: 80px;
            background: #f8bbd0;
            border-radius: 10px;
            position: relative;
            margin: 0 auto;
        }
        
        .cake:before {
            content: '';
            position: absolute;
            width: 200px;
            height: 20px;
            background: #ff80ab;
            border-radius: 10px;
            top: -10px;
            left: -10px;
        }
        
        .candle {
            width: 10px;
            height: 40px;
            background: #4fc3f7;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .flame {
            width: 15px;
            height: 25px;
            background: #ffeb3b;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.5s infinite alternate;
        }
        
        .balloons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        .balloon {
            width: 60px;
            height: 70px;
            border-radius: 50%;
            position: relative;
            animation: float 4s infinite ease-in-out;
        }
        
        .balloon:before {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: #333;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .balloon:nth-child(1) {
            background: #ff5252;
            animation-delay: 0s;
        }
        
        .balloon:nth-child(2) {
            background: #448aff;
            animation-delay: 0.5s;
        }
        
        .balloon:nth-child(3) {
            background: #69f0ae;
            animation-delay: 1s;
        }
        
        .balloon:nth-child(4) {
            background: #ffeb3b;
            animation-delay: 1.5s;
        }
        
        .message {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            box-shadow: 0 4px 0 #d81b60;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #d81b60;
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 0 #d81b60;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f00;
            opacity: 0.8;
            top: -10px;
            animation: confetti-fall 5s linear forwards;
            z-index: 1;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 0.8; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: firework-explode 1s forwards;
        }
        
        @keyframes firework-explode {
            0% { transform: translate(var(--x), var(--y)) scale(0); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .balloons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Birthday!</h1>
        
        <div class="birthday-cake">
            <div class="cake"></div>
            <div class="candle"></div>
            <div class="flame"></div>
        </div>
        
        <div class="balloons">
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
        </div>
        
        <div class="message">
            <h2>Wishing you a fantastic day filled with joy and laughter!</h2>
            <p>May all your dreams and wishes come true. Enjoy your special day to the fullest!</p>
        </div>
        
        <button id="celebrateBtn">Click for Celebration!</button>
    </div>
    
    <div class="fireworks" id="fireworks"></div>

    <script>
        document.getElementById('celebrateBtn').addEventListener('click', function() {
            createConfetti();
            createFireworks();
            singHappyBirthday();
            document.querySelector('.message').style.animation = 'bounce 0.5s 3';
        });
        
        function createConfetti() {
            const colors = ['#ff5252', '#448aff', '#69f0ae', '#ffeb3b', '#ff4081', '#7c4dff'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => { confetti.remove(); }, 7000);
            }
        }
        
        function createFireworks() {
            const fireworksContainer = document.getElementById('fireworks');
            const colors = ['#ff5252', '#448aff', '#69f0ae', '#ffeb3b', '#ff4081', '#7c4dff'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    for (let j = 0; j < 50; j++) {
                        const firework = document.createElement('div');
                        firework.className = 'firework';
                        firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                        firework.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
                        firework.style.setProperty('--y', (Math.random() * 200 - 100) + 'px');
                        firework.style.left = x + 'vw';
                        firework.style.top = y + 'vh';
                        firework.style.animationDelay = (j * 0.02) + 's';
                        fireworksContainer.appendChild(firework);
                        setTimeout(() => { firework.remove(); }, 1200);
                    }
                }, i * 300);
            }
        }
        
        function singHappyBirthday() {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance();
                speech.text = "Happy birthday to you! Happy birthday to you! Happy birthday dear friend! Happy birthday to you!";
                speech.rate = 0.9;
                speech.pitch = 1.2;
                window.speechSynthesis.speak(speech);
            }
        }
        
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 1000);
        });
    </script>
</body>
</html>
